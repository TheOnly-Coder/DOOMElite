<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DOOMELITE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(180, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(180, 0, 0, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0a 0%, #1a0505 50%, #0a0a0a 100%);
            z-index: -1;
        }
        .header {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .header h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 3.5em;
            color: #cc0000;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5), 0 0 40px rgba(255, 0, 0, 0.2);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 0, 0, 0.5), 0 0 40px rgba(255, 0, 0, 0.2); }
            50% { text-shadow: 0 0 30px rgba(255, 0, 0, 0.8), 0 0 60px rgba(255, 0, 0, 0.4); }
        }
        .header p {
            color: #888;
            font-size: 0.85em;
            margin-top: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        /* Landing */
        .landing { text-align: center; padding: 40px 20px; }
        .launch-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 50px;
            background: linear-gradient(180deg, #cc0000, #880000);
            color: white;
            border: none;
            border-radius: 4px;
            font-family: 'Impact', sans-serif;
            font-size: 1.3em;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .launch-btn:hover {
            background: linear-gradient(180deg, #ee0000, #aa0000);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            transform: scale(1.05);
        }
        .launch-btn:disabled {
            background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none;
        }
        .subtitle { color: #999; font-size: 0.9em; margin-top: 15px; line-height: 1.6; }
        /* Progress */
        #progress-section {
            display: none; text-align: center; padding: 60px 20px;
        }
        .progress-bar-outer {
            width: 300px; max-width: 80vw; height: 8px;
            background: #222; border-radius: 4px; margin: 20px auto; overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%; background: linear-gradient(90deg, #cc0000, #ff3333);
            width: 0%; border-radius: 4px; transition: width 0.3s;
        }
        .progress-text { color: #cc0000; font-size: 1em; letter-spacing: 2px; }
        .progress-detail { color: #666; font-size: 0.8em; margin-top: 8px; }
        /* Game Container - fullscreen */
        #game-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
            cursor: crosshair;
        }
        #status {
            position: fixed;
            bottom: 10px; left: 50%; transform: translateX(-50%);
            font-size: 0.75em; color: #555; z-index: 101;
            pointer-events: none;
            text-align: center;
        }
        /* Controls info */
        .controls-info {
            margin-top: 20px; padding: 15px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #2a2a2a; border-radius: 6px; text-align: left;
            max-width: 500px;
        }
        .controls-info h3 {
            color: #cc0000; font-size: 0.95em; margin-bottom: 10px; letter-spacing: 2px;
        }
        .controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; font-size: 0.8em;
        }
        .control-item { display: flex; align-items: center; gap: 8px; }
        .control-key {
            background: #222; border: 1px solid #444; border-radius: 3px;
            padding: 2px 8px; color: #cc0000;
            font-family: 'Courier New', monospace; font-size: 0.9em;
            min-width: 40px; text-align: center;
        }
        .control-desc { color: #888; }
        .footer {
            text-align: center; padding: 20px; color: #444; font-size: 0.75em; margin-top: 20px;
        }
        .footer a { color: #cc0000; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .header h1 { font-size: 2.2em; letter-spacing: 4px; }
            .controls-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header" id="header">
        <h1>DOOMELITE</h1>
        <p>Enter the Arena</p>
    </div>

    <!-- Landing -->
    <div class="landing" id="landing">
        <button class="launch-btn" id="play-btn">PLAY</button>
        <p class="subtitle">Click to enter fullscreen combat</p>
        <div class="controls-info" id="controls-info">
            <h3>CONTROLS</h3>
            <div class="controls-grid">
                <div class="control-item"><span class="control-key">WASD</span><span class="control-desc">Move</span></div>
                <div class="control-item"><span class="control-key">Mouse</span><span class="control-desc">Look / Fire</span></div>
                <div class="control-item"><span class="control-key">Space</span><span class="control-desc">Use / Open</span></div>
                <div class="control-item"><span class="control-key">1-7</span><span class="control-desc">Weapons</span></div>
                <div class="control-item"><span class="control-key">Shift</span><span class="control-desc">Run</span></div>
                <div class="control-item"><span class="control-key">Tab</span><span class="control-desc">Map</span></div>
                <div class="control-item"><span class="control-key">Esc</span><span class="control-desc">Menu</span></div>
                <div class="control-item"><span class="control-key">F11</span><span class="control-desc">Fullscreen</span></div>
            </div>
        </div>
    </div>

    <!-- Progress -->
    <div id="progress-section">
        <div class="progress-text" id="progress-label">LOADING DOOMELITE...</div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
        <div class="progress-detail" id="progress-detail"></div>
    </div>

    <!-- Game (fullscreen overlay) -->
    <div id="game-container">
        <canvas id="canvas" width="640" height="400"></canvas>
        <div id="status">Starting...</div>
    </div>

    <div class="footer" id="footer">
        <p>DOOMELITE | Based on DOOM &copy; id Software 1993 | <a href="https://github.com/TheOnly-Coder/DOOMElite" target="_blank">GitHub</a></p>
    </div>

    <script>
    (function() {
        var landing = document.getElementById('landing');
        var playBtn = document.getElementById('play-btn');
        var progressSection = document.getElementById('progress-section');
        var progressBar = document.getElementById('progress-bar');
        var progressLabel = document.getElementById('progress-label');
        var progressDetail = document.getElementById('progress-detail');
        var gameContainer = document.getElementById('game-container');
        var statusEl = document.getElementById('status');
        var header = document.getElementById('header');
        var footer = document.getElementById('footer');

        var filesToLoad = [
            { url: 'doom1.wad', name: 'doom1.wad' },
            { url: 'doomelite.wad', name: 'doomelite.wad' }
        ];
        var loadedData = [];

        playBtn.addEventListener('click', function() {
            playBtn.disabled = true;
            playBtn.textContent = 'LOADING...';
            loadAllFiles(0);
        });

        function loadAllFiles(idx) {
            if (idx >= filesToLoad.length) {
                // All loaded, start game
                progressLabel.textContent = 'STARTING ENGINE...';
                progressDetail.textContent = '';
                setTimeout(function() { startDOOM(loadedData); }, 200);
                return;
            }
            var f = filesToLoad[idx];
            landing.style.display = 'none';
            progressSection.style.display = 'block';
            progressLabel.textContent = 'LOADING ' + f.name.toUpperCase();

            var xhr = new XMLHttpRequest();
            xhr.open('GET', f.url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onprogress = function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round(e.loaded / e.total * 100);
                    var mb = (e.loaded / 1048576).toFixed(1);
                    var totalMB = (e.total / 1048576).toFixed(1);
                    progressBar.style.width = pct + '%';
                    progressDetail.textContent = mb + ' MB / ' + totalMB + ' MB';
                }
            };
            xhr.onload = function() {
                if (xhr.status === 200) {
                    loadedData.push({ name: f.name, data: new Uint8Array(xhr.response) });
                    loadAllFiles(idx + 1);
                } else {
                    progressLabel.textContent = 'FAILED TO LOAD';
                    progressDetail.textContent = 'HTTP ' + xhr.status;
                }
            };
            xhr.onerror = function() {
                progressLabel.textContent = 'NETWORK ERROR';
                progressDetail.textContent = 'Check your connection.';
            };
            xhr.send();
        }

        function startDOOM(files) {
            progressSection.style.display = 'none';
            header.style.display = 'none';
            footer.style.display = 'none';
            gameContainer.style.display = 'block';
            statusEl.textContent = 'Initializing...';
            statusEl.style.color = '#cc0000';

            // Go fullscreen
            var goFS = gameContainer.requestFullscreen || gameContainer.webkitRequestFullscreen || gameContainer.msRequestFullscreen;
            if (goFS) {
                goFS.call(gameContainer).catch(function(){});
            }

            // doom1.wad = IWAD, doomelite.wad = PWAD patch
            var args = ['doom', '-iwad', '/' + files[0].name];
            for (var i = 1; i < files.length; i++) {
                args.push('-file', '/' + files[i].name);
            }

            var doomModule = {
                preRun: function() {
                    for (var i = 0; i < files.length; i++) {
                        FS.createDataFile('/', files[i].name, files[i].data, true, false);
                    }
                },
                arguments: args,
                print: function(text) { console.log('[DOOM]', text); },
                printErr: function(text) {
                    console.warn('[DOOM]', text);
                    if (text && text.indexOf('Z_Init') >= 0) {
                        statusEl.textContent = '';
                    }
                },
                canvas: document.getElementById('canvas')
            };

            Module = doomModule;
            var script = document.createElement('script');
            script.src = 'doom.js';
            script.onerror = function() {
                statusEl.textContent = 'Failed to load engine.';
                statusEl.style.color = '#ff4444';
            };
            document.head.appendChild(script);
        }
    })();
    </script>
</body>
</html>
